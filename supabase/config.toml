# Configuration Supabase locale. `supabase start` la lit.
# Les valeurs de production se règlent dans le tableau de bord Supabase ;
# les gabarits d'e-mail, eux, se collent depuis supabase/templates/.

project_id = "fonte"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "8MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirmer", "http://localhost:3000/auth/callback"]

# Une heure pour le jeton d'accès, rotation des jetons de rafraîchissement.
# Personne ne doit avoir à se reconnecter en arrivant à la salle : c'est le
# rafraîchissement côté middleware qui tient la session, pas une durée longue.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600
# 8 caractères : la longueur protège, pas les caractères exotiques.
# Voir ForceMotDePasse dans src/components/ui/Champ.tsx.

[auth.email.template.confirmation]
subject = "Confirme ton adresse — FONTE"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Ton lien de connexion — FONTE"
content_path = "./supabase/templates/connexion.html"

[auth.email.template.recovery]
subject = "Nouveau mot de passe — FONTE"
content_path = "./supabase/templates/reinitialisation.html"

[auth.sessions]
# Déconnexion après 30 jours sans ouvrir l'app. Assez long pour couvrir
# des vacances, assez court pour qu'un téléphone perdu finisse par se fermer.
timebox = "720h"
inactivity_timeout = "720h"
